<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>3Dブロックくずし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#070b1f; --panel:#141c46; --line:#4fd1ff; --ring:#4ff0ff;
    --action:#ffcc33; --text:#f4f7ff; --sub:#a9b6e8; --heart:#ff5d7a;
  }
  html,body{
    margin:0; height:100%; overflow:hidden; background:var(--night); color:var(--text);
    font-family:'BIZ UDPGothic','Hiragino Sans','Yu Gothic',sans-serif;
    touch-action:manipulation; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  }
  #game{position:fixed; inset:0; touch-action:none;}
  #game canvas{display:block; width:100%; height:100%;}
  rt{font-size:0.5em; color:inherit;}

  #hud{
    position:fixed; left:0; right:0; top:0;
    padding:calc(env(safe-area-inset-top, 0px) + 10px) 140px 0 16px;
    display:flex; flex-wrap:wrap; gap:6px 22px; align-items:center;
    font-size:20px; font-weight:700; pointer-events:none; text-shadow:0 2px 4px #000;
  }
  #hud .lbl{font-size:15px; color:var(--sub); margin-right:6px;}
  #hLives{color:var(--heart); letter-spacing:2px;}

  .hbtn{
    position:fixed; top:calc(env(safe-area-inset-top, 0px) + 8px);
    width:54px; height:54px; border-radius:50%; border:2px solid var(--line);
    background:rgba(20,28,70,.85); color:var(--text); font-size:26px; font-weight:700;
    font-family:inherit; display:flex; align-items:center; justify-content:center; padding:0; z-index:5;
  }
  #helpBtn{right:14px;}
  #pauseBtn{right:78px; font-size:20px;}

  #hint{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 28px);
    transform:translateX(-50%); font-size:22px; font-weight:700; pointer-events:none;
    background:rgba(7,11,31,.7); padding:8px 18px; border-radius:24px; white-space:nowrap;
  }
  #banner{
    position:fixed; left:50%; top:38%; transform:translate(-50%,-50%);
    font-size:40px; font-weight:700; text-align:center; pointer-events:none;
    text-shadow:0 3px 10px #000, 0 0 20px rgba(79,240,255,.6); opacity:0; transition:opacity .3s; white-space:nowrap;
  }
  #banner.show{opacity:1;}
  #ver{
    position:fixed; right:8px; bottom:calc(env(safe-area-inset-bottom, 0px) + 4px);
    font-size:11px; color:var(--sub); opacity:.6; pointer-events:none;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(5,8,25,.84); z-index:10;
    display:flex; align-items:center; justify-content:center; touch-action:manipulation;
  }
  .overlay.hidden{display:none;}
  .panel{
    background:var(--panel); border:2px solid var(--line); border-radius:20px;
    padding:20px 24px 24px; width:min(820px,92vw); max-height:88vh; overflow-y:auto;
    -webkit-overflow-scrolling:touch; box-sizing:border-box; text-align:center;
  }
  .panel.small{width:min(460px,90vw);}
  .panel h1{font-size:34px; margin:6px 0 4px;}
  .panel h2{font-size:30px; margin:6px 0 10px;}
  .panel p{font-size:20px; line-height:1.9; margin:6px 0;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:14px 0;}
  .card{background:#0d1435; border-radius:14px; padding:10px 10px 12px;}
  .card svg{width:100%; max-width:220px; height:auto; display:block; margin:0 auto 6px;}
  .card div{font-size:18px; line-height:1.9;}
  .diff{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:8px 0 14px;}
  .diff button{
    min-height:56px; min-width:130px; font-size:20px; font-weight:700; font-family:inherit;
    border-radius:14px; border:3px solid #3a4ea0; background:#0d1435; color:var(--text);
  }
  .diff button.on{border-color:var(--action); background:#2b2a12; color:var(--action);}
  .big{
    min-height:60px; min-width:200px; padding:0 28px; font-size:26px; font-weight:700; font-family:inherit;
    border:none; border-radius:16px; background:var(--action); color:#1d1a05; margin:6px;
  }
  .big.sub{background:#2c3a7a; color:var(--text);}
  .hidden{display:none !important;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- 説明画面（開始時・？ボタン共通） -->

  <div class="panel scroll">
    <h1>3Dブロックくずし</h1>
    <p><ruby>奥<rt>おく</rt></ruby>にある ブロックを ボールで こわそう！</p>
    <div class="cards">

        <svg viewBox="0 0 160 110">

          <rect x="30" y="34" width="52" height="36" rx="4" fill="rgba(79,209,255,.2)" stroke="#4fd1ff" stroke-width="3"/>
          <circle cx="116" cy="70" r="11" fill="#ffd9b3"/>

      <div class="card">
        <svg viewBox="0 0 160 110">

          <rect x="54" y="56" width="52" height="36" rx="4" fill="rgba(79,209,255,.2)" stroke="#4fd1ff" stroke-width="3"/>
          <circle cx="80" cy="74" r="7" fill="#fff"/>
          <path d="M80 50 L80 22" stroke="#fff" stroke-width="3" stroke-dasharray="4 4"/>

          <g stroke="#fff" stroke-width="1.5">
            <rect x="52" y="44" width="22" height="22" fill="#ff7a59"/><rect x="74" y="44" width="22" height="22" fill="#ff7a59"/>
            <rect x="52" y="66" width="22" height="22" fill="#ffd23f"/><rect x="74" y="66" width="22" height="22" fill="#ffd23f"/>
            <path d="M52 44 l10 -10 h44 l-10 10z" fill="#3ee07a"/><path d="M96 44 l10 -10 v44 l-10 10z" fill="#3fb8ff"/>

<script type="module">
import * as THREE from 'three';

const VERSION = 'v2026-09-24';
document.getElementById('ver').textContent = VERSION;

/* ============================================================
   iPad対策：ズーム・スクロールバウンス防止
   ============================================================ */
document.addEventListener('gesturestart', e => e.preventDefault(), { passive:false });
document.addEventListener('gesturechange', e => e.preventDefault(), { passive:false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive:false });
document.addEventListener('touchmove', e => {
  // 説明パネル（.scroll）内の1本指スクロールだけ許可
  if (e.touches.length > 1 || !e.target.closest('.scroll')) e.preventDefault();
}, { passive:false });

/* ============================================================
   定数
   ============================================================ */
const W = 7, H = 5, HX = W / 2, HY = H / 2;   // トンネルの幅・高さ（1マス=1）
const BACKZ = -20;                            // 奥の壁
const R = 0.3;                                // ボール半径
const GRID_Z0 = -9;                           // ブロック領域の手前の面
const BHALF = 0.5;                            // ブロック当たり判定の半分サイズ
const MISS_Z = 1.5;                           // これより手前に来たらミス

const DIFFS = {
  easy:   { speed: 6.5,  pw: 3.0, ph: 2.2,  marker: true  },
  normal: { speed: 8.5,  pw: 2.4, ph: 1.8,  marker: true  },
  hard:   { speed: 10.5, pw: 1.8, ph: 1.35, marker: false },
};

// ステージ：セル座標 [i(横0-6), j(縦0-4), k(奥0-)]
function box(i0,i1,j0,j1,k0,k1, skip){
  const a=[];
  for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++) for(let k=k0;k<=k1;k++){
    if(!skip || !skip(i,j,k)) a.push([i,j,k]);
  }
  return a;
}
const STAGES = [
  { name:'かべ', cells: box(1,5, 1,3, 0,0) },
  { name:'<ruby>立方体<rt>りっぽうたい</rt></ruby>', cells: box(2,4, 1,3, 0,2) },
  { name:'なかが からっぽの はこ', cells: box(1,5, 1,3, 0,2, (i,j,k)=> i>=2&&i<=4 && j===2 && k===1) },
];
document.getElementById('hStageMax').textContent = STAGES.length;
const PALETTE = ['#ff7a59','#ffd23f','#3ee07a','#3fb8ff','#b57bff'];

/* ============================================================
   ゲーム状態（テストフック window.__G と共有）
   ボールは G.ball.p / G.ball.v（内部データ）で駆動し、
   meshへは毎フレーム同期する。位置を変える場合は api.setBall を使うこと。
   ============================================================ */
const G = {
  version: VERSION,
  state: 'title',          // title | ready | play | clear | over | allclear
  paused: false,
  frames: 0, elapsed: 0,
  diffKey: 'easy', diff: DIFFS.easy,
  stage: 0, lives: 3, score: 0,
  ball: { p: new THREE.Vector3(0,0,-R), v: new THREE.Vector3() },
  paddle: { x:0, y:0, w:3, h:2.2, vx:0, vy:0 },
  blocks: [],
  prediction: null,        // 着地予測 {x,y,t}
  camera: null,
  api: {},
  note: 'ボールは G.ball.p/v、パドルは G.paddle.x/y で駆動。直接 mesh.position を触らないこと。',
};
window.__G = G;

/* ============================================================
   Three.js 初期化
   ============================================================ */
const container = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#070b1f');
const FOV = 55;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
G.camera = camera;

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const dl = new THREE.DirectionalLight(0xffffff, 1.3);
dl.position.set(2, 4, 8);
scene.add(dl);

// --- トンネル ---
const wallMat = new THREE.MeshStandardMaterial({ color:'#141b44', roughness:1, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 });
const floorMat = new THREE.MeshStandardMaterial({ color:'#1b2455', roughness:1, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 });
const D = -BACKZ;
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), floorMat);
  floor.rotation.x = -Math.PI/2; floor.position.set(0, -HY, BACKZ/2); scene.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), wallMat);
  ceil.rotation.x = Math.PI/2; ceil.position.set(0, HY, BACKZ/2); scene.add(ceil);
  const left = new THREE.Mesh(new THREE.PlaneGeometry(D, H), wallMat);
  left.rotation.y = Math.PI/2; left.position.set(-HX, 0, BACKZ/2); scene.add(left);
  const right = new THREE.Mesh(new THREE.PlaneGeometry(D, H), wallMat);
  right.rotation.y = -Math.PI/2; right.position.set(HX, 0, BACKZ/2); scene.add(right);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(W, H), floorMat);
  back.position.set(0, 0, BACKZ); scene.add(back);

  // グリッド線
  const pts = [];
  for (let x=-HX; x<=HX+1e-6; x+=1) { pts.push(x,-HY,0, x,-HY,BACKZ, x,HY,0, x,HY,BACKZ, x,-HY,BACKZ, x,HY,BACKZ); }
  for (let y=-HY; y<=HY+1e-6; y+=1) { pts.push(-HX,y,0, -HX,y,BACKZ, HX,y,0, HX,y,BACKZ, -HX,y,BACKZ, HX,y,BACKZ); }
  for (let z=-2; z>BACKZ; z-=2) {
    pts.push(-HX,-HY,z, HX,-HY,z,  HX,-HY,z, HX,HY,z,  HX,HY,z, -HX,HY,z,  -HX,HY,z, -HX,-HY,z);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color:'#3a4ea0', transparent:true, opacity:0.55 })));
}

// 四角い枠（深さリング・入口の枠で共用）
function makeFrame(w, h, t, color, opacity){
  const grp = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity, depthWrite:false });
  const hor = new THREE.BoxGeometry(w + t, t, t), ver = new THREE.BoxGeometry(t, h + t, t);
  const a = new THREE.Mesh(hor, mat); a.position.y =  h/2;
  const b = new THREE.Mesh(hor, mat); b.position.y = -h/2;
  const c = new THREE.Mesh(ver, mat); c.position.x = -w/2;
  const d = new THREE.Mesh(ver, mat); d.position.x =  w/2;
  grp.add(a,b,c,d);
  grp.userData.mat = mat;
  return grp;
}
const mouth = makeFrame(W, H, 0.06, '#ffffff', 0.35);
scene.add(mouth);
const depthRing = makeFrame(W, H, 0.1, '#4ff0ff', 0.95);
depthRing.renderOrder = 5;
scene.add(depthRing);

// --- ボール ---
const ballMat = new THREE.MeshStandardMaterial({ color:'#ffffff', emissive:'#ffffff', emissiveIntensity:0.4, roughness:0.3 });
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(R, 28, 18), ballMat);
scene.add(ballMesh);
const COL_FAR = new THREE.Color('#b8c8ff'), COL_NEAR = new THREE.Color('#ffffff');

// --- 影（床・左右の壁） ---
const shadowGeo = new THREE.CircleGeometry(R*1.3, 24);
function makeShadow(op){ return new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({ color:'#000', transparent:true, opacity:op, depthWrite:false })); }
const shFloor = makeShadow(0.75); shFloor.rotation.x = -Math.PI/2; scene.add(shFloor);
const shLeft  = makeShadow(0.4); shLeft.rotation.y  =  Math.PI/2; scene.add(shLeft);
const shRight = makeShadow(0.4); shRight.rotation.y = -Math.PI/2; scene.add(shRight);

// --- 着地マーカー ---
const marker = new THREE.Group();
{
  const m = new THREE.MeshBasicMaterial({ color:'#ffe14d', transparent:true, opacity:1, depthWrite:false, side:THREE.DoubleSide });
  marker.add(new THREE.Mesh(new THREE.RingGeometry(R*0.95, R*1.3, 36), m));
  const dot = new THREE.Mesh(new THREE.CircleGeometry(R*0.18, 16), m);
  marker.add(dot);
  marker.userData.mat = m;
  marker.renderOrder = 6;
}
scene.add(marker);

// --- パドル ---
const paddleGrp = new THREE.Group();
scene.add(paddleGrp);
let paddleFlash = 0;
function buildPaddle(){
  paddleGrp.clear();
  const { w, h } = G.paddle;
  const fillMat = new THREE.MeshBasicMaterial({ color:'#4fd1ff', transparent:true, opacity:0.16, depthWrite:false, side:THREE.DoubleSide });
  paddleGrp.add(new THREE.Mesh(new THREE.PlaneGeometry(w, h), fillMat));
  const frame = makeFrame(w, h, 0.06, '#4fd1ff', 0.95);
  paddleGrp.add(frame);
  paddleGrp.userData.fill = fillMat;
  paddleGrp.userData.frame = frame.userData.mat;
  paddleGrp.renderOrder = 4;
}

// --- ブロック ---
const blockGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
const edgeGeo = new THREE.EdgesGeometry(blockGeo);
const edgeMat = new THREE.LineBasicMaterial({ color:'#ffffff', transparent:true, opacity:0.7 });
const blockMats = PALETTE.map(c => new THREE.MeshStandardMaterial({ color:c, emissive:c, emissiveIntensity:0.35, roughness:0.5 }));
const blockGrp = new THREE.Group();
scene.add(blockGrp);

function cellPos(i,j,k){ return [ -HX + 0.5 + i, -HY + 0.5 + j, GRID_Z0 - 0.5 - k ]; }

// --- 破片パーティクル ---
const partGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);
const partMats = PALETTE.map(c => new THREE.MeshBasicMaterial({ color:c, transparent:true }));
const particles = [];
for (let n=0; n<160; n++){
  const m = new THREE.Mesh(partGeo, partMats[0]);
  m.visible = false; scene.add(m);
  particles.push({ mesh:m, v:new THREE.Vector3(), life:0 });
}
let partIdx = 0;
function burst(pos, colorIdx){
  for (let n=0; n<10; n++){
    const pt = particles[partIdx]; partIdx = (partIdx+1) % particles.length;
    pt.mesh.material = partMats[colorIdx];
    pt.mesh.position.copy(pos);
    pt.v.set((Math.random()-0.5)*6, (Math.random()-0.2)*6, (Math.random()-0.5)*6);
    pt.life = 0.7 + Math.random()*0.3;
    pt.mesh.visible = true;
  }
}
function updateParticles(dt){
  for (const pt of particles){
    if (pt.life <= 0) continue;
    pt.life -= dt;
    pt.v.y -= 9 * dt;
    pt.mesh.position.addScaledVector(pt.v, dt);
    pt.mesh.rotation.x += dt*6; pt.mesh.rotation.y += dt*5;
    pt.mesh.scale.setScalar(Math.max(pt.life, 0.01));
    if (pt.life <= 0) pt.mesh.visible = false;
  }
}

/* ============================================================
   カメラ・リサイズ
   ============================================================ */
let camDist = 8, worldPerPx = 0.01;
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  const t = Math.tan(THREE.MathUtils.degToRad(FOV/2));
  camDist = Math.max((HY + 0.25) / t, (HX + 0.25) / (t * camera.aspect));
  camera.position.set(0, 0, camDist);
  camera.lookAt(0, 0, -10);
  camera.updateProjectionMatrix();
  worldPerPx = (2 * camDist * t) / h;   // パドル面（z=0）での1pxあたりの長さ
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   音（Web Audio API）
   ============================================================ */
let AC = null;
function ensureAudio(){
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state !== 'running') AC.resume();
  } catch(e) {}
}
function tone(freq, dur, type='sine', vol=0.15, slideTo=null, delay=0){
  if (!AC) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol=0.1){
  if (!AC) return;
  const len = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let n=0; n<len; n++) d[n] = (Math.random()*2-1) * (1 - n/len);
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = buf; g.gain.value = vol;
  s.connect(g).connect(AC.destination); s.start();
}
let lastWallSfx = 0;
const SFX = {
  paddle: () => tone(520, 0.09, 'square', 0.1),
  wall:   () => { const n = performance.now(); if (n - lastWallSfx > 60){ lastWallSfx = n; tone(240, 0.05, 'triangle', 0.08); } },
  block:  () => { tone(880, 0.12, 'sine', 0.16, 1400); noise(0.08, 0.08); },
  launch: () => tone(400, 0.12, 'triangle', 0.12, 800),
  miss:   () => tone(320, 0.45, 'sawtooth', 0.1, 90),
  clear:  () => [523,659,784,1047].forEach((f,n) => tone(f, 0.22, 'triangle', 0.14, null, n*0.12)),
  over:   () => [392,330,262].forEach((f,n) => tone(f, 0.3, 'triangle', 0.14, null, n*0.2)),
};

/* ============================================================
   UI
   ============================================================ */
const $ = id => document.getElementById(id);
const helpOv = $('helpOv'), pauseOv = $('pauseOv'), msgOv = $('msgOv');
let bannerTimer = 0;
function showBanner(html, ms=1600){
  const b = $('banner'); b.innerHTML = html; b.classList.add('show');
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => b.classList.remove('show'), ms);
}
function updateHUD(){
  $('hStage').textContent = G.stage + 1;
  $('hScore').textContent = G.score;
  $('hLives').textContent = '♥'.repeat(Math.max(G.lives,0)) + '♡'.repeat(Math.max(3 - G.lives, 0));
  $('hLeft').textContent = G.blocks.filter(b => b.alive).length;
}
function updateHint(){
  $('hint').classList.toggle('hidden', !(G.state === 'ready' && !G.paused));
}
function showMsg(title, text, btnText, onClick){
  $('msgTitle').innerHTML = title; $('msgText').innerHTML = text; $('msgBtn').textContent = btnText;
  $('msgBtn').onclick = () => { ensureAudio(); msgOv.classList.add('hidden'); onClick(); };
  msgOv.classList.remove('hidden');
}

// 難易度選択
document.querySelectorAll('.diff button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    G.diffKey = btn.dataset.d;
  });
});

$('startBtn').addEventListener('click', () => {
  ensureAudio();
  if (G.state === 'title') startGame(G.diffKey);
  else closeHelp();
});
$('helpBtn').addEventListener('click', () => { ensureAudio(); openHelp(); });
$('pauseBtn').addEventListener('click', () => { ensureAudio(); openPause(); });
$('resumeBtn').addEventListener('click', () => { ensureAudio(); pauseOv.classList.add('hidden'); G.paused = false; updateHint(); });
$('quitBtn').addEventListener('click', () => { pauseOv.classList.add('hidden'); toTitle(); });

function openHelp(){
  if (G.state === 'title' || !helpOv.classList.contains('hidden')) return;
  G.paused = true;
  $('diffBox').classList.add('hidden');
  $('startBtn').textContent = 'つづける';
  helpOv.classList.remove('hidden');
  updateHint();
}
function closeHelp(){
  helpOv.classList.add('hidden');
  G.paused = !pauseOv.classList.contains('hidden');
  updateHint();
}
function openPause(){
  if (G.state !== 'ready' && G.state !== 'play') return;
  G.paused = true;
  pauseOv.classList.remove('hidden');
  updateHint();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) openPause(); });

/* ============================================================
   入力（どこを触ってもよい相対ドラッグ／タップで発射）
   ============================================================ */
const SENS = 1.35;
let drag = null;
container.addEventListener('pointerdown', e => {
  ensureAudio();
  if (drag) return;
  drag = { id:e.pointerId, x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, t:performance.now() };
  try { container.setPointerCapture(e.pointerId); } catch(_) {}
});
container.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (G.paused || (G.state !== 'ready' && G.state !== 'play')) return;
  movePaddle(G.paddle.x + dx * worldPerPx * SENS, G.paddle.y - dy * worldPerPx * SENS);
});
function endDrag(e){
  if (!drag || e.pointerId !== drag.id) return;
  const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
  const quick = performance.now() - drag.t < 350;
  drag = null;
  if (moved < 12 && quick && G.state === 'ready' && !G.paused) launch();
}
container.addEventListener('pointerup', endDrag);
container.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) drag = null; });
window.addEventListener('keydown', e => { if (e.code === 'Space' && G.state === 'ready' && !G.paused) launch(); });

function movePaddle(x, y){
  const p = G.paddle;
  p.x = THREE.MathUtils.clamp(x, -HX + p.w/2, HX - p.w/2);
  p.y = THREE.MathUtils.clamp(y, -HY + p.h/2, HY - p.h/2);
}

/* ============================================================
   ゲーム進行
   ============================================================ */
function startGame(diffKey){
  G.diffKey = diffKey; G.diff = DIFFS[diffKey];
  G.paddle.w = G.diff.pw; G.paddle.h = G.diff.ph;
  buildPaddle(); movePaddle(0, 0);
  G.lives = 3; G.score = 0;
  helpOv.classList.add('hidden');
  G.paused = false;
  loadStage(0);
}
function loadStage(n){
  G.stage = n;
  for (const b of G.blocks) blockGrp.remove(b.mesh);
  G.blocks = STAGES[n].cells.map(([i,j,k]) => {
    const [x,y,z] = cellPos(i,j,k);
    const c = k % PALETTE.length;
    const mesh = new THREE.Mesh(blockGeo, blockMats[c]);
    mesh.add(new THREE.LineSegments(edgeGeo, edgeMat));
    mesh.position.set(x,y,z);
    mesh.scale.setScalar(0.01);
    blockGrp.add(mesh);
    return { i,j,k, x,y,z, color:c, hp:1, alive:true, mesh, appear: -0.08*k - 0.02*(i+j) };
  });
  resetBall();
  updateHUD();
  showBanner(`ステージ ${n+1}<br><span style="font-size:28px">${STAGES[n].name}</span>`, 1800);
}
function resetBall(){
  G.state = 'ready';
  G.ball.v.set(0,0,0);
  G.prediction = null;
  updateHint();
}
function launch(){
  if (G.state !== 'ready') return;
  const v = new THREE.Vector3((Math.random()-0.5)*0.35, 0.18, -1).normalize().multiplyScalar(G.diff.speed);
  G.ball.v.copy(v);
  G.state = 'play';
  SFX.launch();
  updateHint();
}
function miss(){
  G.lives--;
  SFX.miss();
  updateHUD();
  if (G.lives <= 0){
    G.state = 'over';
    ballMesh.visible = false;
    setTimeout(() => {
      SFX.over();
      showMsg('ゲームオーバー', `スコア　${G.score}`, 'もういちど', toTitle);
    }, 600);
  } else {
    showBanner('ミス！', 1000);
    resetBall();
  }
}
function checkClear(){
  if (G.blocks.some(b => b.alive)) return;
  G.state = 'clear';
  G.prediction = null;
  SFX.clear();
  updateHint();
  const last = G.stage >= STAGES.length - 1;
  setTimeout(() => {
    if (last){
      G.state = 'allclear';
      showMsg('ぜんぶ クリア！', `スコア　${G.score}<br>おめでとう！`, 'もういちど', toTitle);
    } else {
      showMsg('ステージ クリア！', `スコア　${G.score}`, 'つぎへ', () => loadStage(G.stage + 1));
    }
  }, 700);
}
function toTitle(){
  G.state = 'title'; G.paused = false;
  pauseOv.classList.add('hidden'); msgOv.classList.add('hidden');
  $('diffBox').classList.remove('hidden');
  $('startBtn').textContent = 'はじめる';
  helpOv.classList.remove('hidden');
  updateHint();
}

/* ============================================================
   物理（自前の当たり判定・サブステップ）
   ============================================================ */
function step(h){
  const p = G.ball.p, v = G.ball.v;
  const prevZ = p.z;
  p.addScaledVector(v, h);

  // 壁
  if (p.x < -HX + R){ p.x = -HX + R; v.x =  Math.abs(v.x); SFX.wall(); }
  else if (p.x > HX - R){ p.x = HX - R; v.x = -Math.abs(v.x); SFX.wall(); }
  if (p.y < -HY + R){ p.y = -HY + R; v.y =  Math.abs(v.y); SFX.wall(); }
  else if (p.y > HY - R){ p.y = HY - R; v.y = -Math.abs(v.y); SFX.wall(); }
  if (p.z < BACKZ + R){ p.z = BACKZ + R; v.z = Math.abs(v.z); SFX.wall(); }

  // ブロック
  hitBlocks();
  if (G.state !== 'play') return false;

  // パドル（手前の面を通過する瞬間だけ判定）
  if (v.z > 0 && prevZ < -R && p.z >= -R){
    const pd = G.paddle;
    if (Math.abs(p.x - pd.x) <= pd.w/2 + R*0.6 && Math.abs(p.y - pd.y) <= pd.h/2 + R*0.6){
      paddleHit();
    }
  }
  if (p.z > MISS_Z){ miss(); return false; }
  return true;
}

function hitBlocks(){
  const p = G.ball.p, v = G.ball.v;
  let best = null, bestD = Infinity;
  for (const b of G.blocks){
    if (!b.alive) continue;
    const dx = p.x - b.x, dy = p.y - b.y, dz = p.z - b.z;
    if (Math.abs(dx) > BHALF + R || Math.abs(dy) > BHALF + R || Math.abs(dz) > BHALF + R) continue;
    const ex = dx - THREE.MathUtils.clamp(dx, -BHALF, BHALF);
    const ey = dy - THREE.MathUtils.clamp(dy, -BHALF, BHALF);
    const ez = dz - THREE.MathUtils.clamp(dz, -BHALF, BHALF);
    const d2 = ex*ex + ey*ey + ez*ez;
    if (d2 < R*R && d2 < bestD){ bestD = d2; best = { b, ex, ey, ez, dx, dy, dz }; }
  }
  if (!best) return;
  const b = best.b;
  let { ex, ey, ez } = best;
  if (ex === 0 && ey === 0 && ez === 0){ ex = best.dx; ey = best.dy; ez = best.dz; }
  // 反射は最も大きい軸に揃える（ブロックの継ぎ目で変な方向に飛ばないように）
  const ax = Math.abs(ex), ay = Math.abs(ey), az = Math.abs(ez);
  if (ax >= ay && ax >= az){ const s = Math.sign(ex) || 1; v.x = s*Math.abs(v.x); p.x = b.x + s*(BHALF + R); }
  else if (ay >= az){       const s = Math.sign(ey) || 1; v.y = s*Math.abs(v.y); p.y = b.y + s*(BHALF + R); }
  else {                    const s = Math.sign(ez) || 1; v.z = s*Math.abs(v.z); p.z = b.z + s*(BHALF + R); }
  damageBlock(b);
}

function damageBlock(b){
  b.hp--;
  if (b.hp > 0) return;
  b.alive = false;
  blockGrp.remove(b.mesh);
  burst(b.mesh.position, b.color);
  G.score += 100;
  SFX.block();
  updateHUD();
  checkClear();
}

function paddleHit(){
  const p = G.ball.p, v = G.ball.v, pd = G.paddle, sp = G.diff.speed;
  const u = THREE.MathUtils.clamp((p.x - pd.x) / (pd.w/2), -1, 1);
  const w = THREE.MathUtils.clamp((p.y - pd.y) / (pd.h/2), -1, 1);
  const dir = new THREE.Vector3(u*0.85 + v.x/sp*0.25, w*0.85 + v.y/sp*0.25, -1).normalize();
  v.copy(dir.multiplyScalar(sp));
  p.z = -R;
  paddleFlash = 1;
  SFX.paddle();
}

// 着地予測（壁の反射を折り返しで計算）
function fold(x, lo, hi){
  const L = hi - lo;
  let t = (x - lo) % (2*L); if (t < 0) t += 2*L;
  return t <= L ? lo + t : hi - (t - L);
}
function predict(){
  const p = G.ball.p, v = G.ball.v;
  if (G.state !== 'play' || v.z <= 0 || p.z > -R) return null;
  const t = (-R - p.z) / v.z;
  return { x: fold(p.x + v.x*t, -HX+R, HX-R), y: fold(p.y + v.y*t, -HY+R, HY-R), t };
}

function update(dt){
  if (G.state === 'play'){
    const dist = G.diff.speed * dt;
    const n = Math.max(1, Math.ceil(dist / (R * 0.4)));
    for (let s=0; s<n; s++) if (!step(dt/n)) break;
  }
  if (G.state === 'ready'){
    G.ball.p.set(G.paddle.x, G.paddle.y, -R - 0.02);
  }
  G.prediction = predict();
  updateParticles(dt);
  for (const b of G.blocks){
    if (b.alive && b.appear < 1){ b.appear = Math.min(1, b.appear + dt*2.5); b.mesh.scale.setScalar(Math.max(0.01, easeOut(b.appear))); }
  }
}
function easeOut(t){ t = Math.max(0, t); return 1 - Math.pow(1 - t, 3); }

/* ============================================================
   見た目の同期
   ============================================================ */
const tmpCol = new THREE.Color();
function syncVisuals(dt){
  const p = G.ball.p;
  const active = G.state === 'ready' || G.state === 'play';
  ballMesh.visible = active;
  depthRing.visible = active;
  shFloor.visible = shLeft.visible = shRight.visible = active;

  // パドル
  paddleGrp.position.set(G.paddle.x, G.paddle.y, 0);
  paddleGrp.visible = G.state !== 'title';
  if (paddleGrp.userData.fill){
    paddleFlash = Math.max(0, paddleFlash - dt*4);
    paddleGrp.userData.fill.opacity = 0.16 + paddleFlash*0.4;
  }

  if (active){
    ballMesh.position.copy(p);
    const near = THREE.MathUtils.clamp(1 + p.z/12, 0, 1);   // 手前ほど1
    tmpCol.copy(COL_FAR).lerp(COL_NEAR, near);
    ballMat.color.copy(tmpCol); ballMat.emissive.copy(tmpCol);
    ballMat.emissiveIntensity = 0.6 + near*0.4;
    ballMesh.scale.setScalar(1 + near*0.12);

    depthRing.position.z = p.z;
    // 奥にあっても細く見えないよう、枠の太さを距離に合わせて太くする
    const th = (camDist - p.z) / camDist;
    const [ra, rb, rc, rd] = depthRing.children;
    ra.scale.set(1, th, th); rb.scale.set(1, th, th); rc.scale.set(th, 1, th); rd.scale.set(th, 1, th);
    depthRing.userData.mat.opacity = 0.55 + near*0.4;

    shFloor.position.set(p.x, -HY + 0.015, p.z);
    shLeft.position.set(-HX + 0.015, p.y, p.z);
    shRight.position.set(HX - 0.015, p.y, p.z);
  }

  // 着地マーカー（アシスト）
  const pr = G.prediction;
  if (pr && G.diff.marker){
    marker.visible = true;
    marker.position.set(pr.x, pr.y, 0.03);
    const k = Math.min(pr.t, 2) / 2;               // 0=到着直前
    marker.scale.setScalar(1 + k*0.5);
    marker.userData.mat.opacity = 1 - k*0.3;
  } else {
    marker.visible = false;
  }
}

/* ============================================================
   メインループ（dtは1/30秒でクランプ）
   ============================================================ */
let lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 1/30) dt = 1/30;
  G.frames++;
  if (!G.paused && G.state !== 'title'){
    G.elapsed += dt;
    update(dt);
  }
  syncVisuals(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

/* ============================================================
   テスト用API
   ============================================================ */
G.api = {
  start: (d='easy') => { ensureAudio(); startGame(d); },
  movePaddle: (x, y) => movePaddle(x, y),
  launch: () => launch(),
  setBall: (pos, vel) => { G.ball.p.set(...pos); G.ball.v.set(...vel); G.state = 'play'; updateHint(); },
  setStage: n => loadStage(n - 1),          // 1始まり
  clearAllBlocks: () => { for (const b of G.blocks) if (b.alive){ b.alive = false; blockGrp.remove(b.mesh); } updateHUD(); checkClear(); },
  predict: () => predict(),
  aliveCount: () => G.blocks.filter(b => b.alive).length,
};
</script>
